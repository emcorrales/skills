# Re-run the evals whenever the agent's configuration changes, and weekly (models and
# the codebase drift). A config change that drops the pass rate gets reviewed first.
name: agent-evals
on:
  pull_request:
    paths: ["CLAUDE.md", ".claude/**", "evals/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # evals start from past commits
      # Toolchain the eval checks need (same as verify.yml), e.g.:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          git config --global user.name evals && git config --global user.email evals@localhost
          python3 evals/run.py --out eval-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-results, path: eval-results.json, if-no-files-found: ignore }
