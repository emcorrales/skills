# Stage 6 trigger layer: check the control bands daily; breaches arrive as a PR that
# adds intent/<date>-breach-<metric>/intent.md for you to triage with /intent.
# Needs an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret for the 2/3-sigma tiers.
name: maintain
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  bands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: check bands
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          git config --global user.name "sdlc-maintain" && git config --global user.email "sdlc-maintain@users.noreply.github.com"
          python3 sdlc/check.py
      - name: open triage PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout main 2>/dev/null || true
          [ -n "$(git status --porcelain intent/)" ] || { echo "no breaches to triage"; exit 0; }
          branch="maintain/triage-$(date +%F)"
          git checkout -b "$branch"
          git add intent/
          git commit -m "intent: control-band breach for triage"
          git push -u origin "$branch"
          gh pr create --title "Triage: control-band breach $(date +%F)" \
            --body "Written by sdlc/check.py. Triage with /intent: accept (fix now or schedule) or reject (then tune sdlc/bands.json)."
